# ============================================================
#  JPPrison Documentation — MkDocs Material configuration
# ============================================================
#  Preview locally:   mkdocs serve    ->  http://127.0.0.1:8000
#  Build the site:    mkdocs build    ->  site/
#
#  >>> PUBLISHING: the URLs below are set for the GitHub account
#  >>> "Nameeees" and the repository "jpprison-docs", so the
#  >>> top-right repo link and the "edit this page" buttons work.
#  >>> If you rename the repo or move it to another account, update
#  >>> the 3 URLs below and the git remote:
#  >>>   git remote set-url origin https://github.com/<user>/<repo>.git
#  >>> ("MrDriz_" in site_author / copyright is the author credit.)
# ============================================================

site_name: JPPrison Docs
site_author: MrDriz_
site_description: >-
  All-in-one Prison core plugin for Spigot/Paper — enchanted pickaxes,
  custom economies, autosell, pets, minions, robots, crates and more.
site_url: https://nameeees.github.io/jpprison-docs/

repo_url: https://github.com/Nameeees/jpprison-docs
repo_name: Nameeees/jpprison-docs
edit_uri: edit/main/docs/

copyright: JPPrison by MrDriz_ — Mine. Upgrade. Prestige. Repeat. Free with attribution, no resale.

theme:
  name: material
  logo: assets/jpprison-logo.jpg
  favicon: assets/favicon.png
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - toc.follow
  # Dark-only theme: pure black + dark red (JPPrison identity, colors
  # sampled from the JPP logo).
  palette:
    scheme: slate
    primary: black
    accent: red

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nameeees/jpprison-docs
      name: Documentation repository

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
  - Features: features.md
  - Reference:
      - Commands: reference/commands.md
      - Placeholders: reference/placeholders.md
  - API: developer/api.md
  - Changelog: changelog.md
